# 互联 · 三端构建（macOS / Windows / Android）
#
# 触发：
#   - 手动：Actions 页面 → 本 workflow → Run workflow
#   - 推送 tag（如 v0.1.0）：自动构建三端产物
#   - 推送到 main / 对 main 的 PR：跑一遍构建自检（可删掉以节省额度）
#
# 三个 job 互相独立（无 needs），任一平台失败不影响其他平台产物。
# 默认产出未签名 / debug 签名包；签名与公证的可选配置见文件末尾注释。
#
# 说明：真实云盘联调用例（pds.rs / transfer.rs 中带 #[ignore] 的 live_* 测试）需要本机
# ~/.aliyun/pds_config.json 凭据；本 workflow 只做构建，不运行这些用例（默认 cargo test 会跳过）。

name: 构建三端产物

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS（Apple Silicon）→ dmg + .app ─────────────────────────────
  macos:
    name: macOS arm64（dmg）
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查图标资源
        run: |
          for f in src-tauri/icons/icon.icns src-tauri/icons/icon.ico; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少 $f。请在本机执行 pnpm tauri icon assets/app-icon.png 并提交 src-tauri/icons/"
              exit 1
            fi
          done

      - name: 构建 dmg / app
        run: pnpm tauri build

      - name: 压缩 .app（保留可执行权限与符号链接）
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "互联.app" "$GITHUB_WORKSPACE/LinkUp.app.zip"

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: linkup-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            LinkUp.app.zip
          if-no-files-found: error
          retention-days: 14

  # ── Windows x64 → NSIS 安装包 ──────────────────────────────────────
  windows:
    name: Windows x64（NSIS exe）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable（MSVC）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查图标资源
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Error "缺少 src-tauri/icons/icon.ico。请在本机执行 pnpm tauri icon assets/app-icon.png 并提交 src-tauri/icons/"
            exit 1
          }

      - name: 构建 NSIS 安装包
        # tauri.conf.json 的 bundle.targets 面向 macOS（app/dmg），
        # Windows 上显式指定 nsis 才会产出安装包。
        run: pnpm tauri build --bundles nsis

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: linkup-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # ── Android → debug APK ────────────────────────────────────────────
  android:
    name: Android（debug APK）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（platform 35 / build-tools 35 / NDK 27）
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: 配置 NDK 环境变量
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 安装系统依赖（pkg-config 等）
        # rustls 下通常不需要 libssl；保留以兼容可能的系统库探测。
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 检查图标资源
        run: |
          if [ ! -f src-tauri/icons/icon.png ] && [ ! -f src-tauri/icons/icon.ico ]; then
            echo "::error::缺少 src-tauri/icons 下的图标。请在本机执行 pnpm tauri icon assets/app-icon.png 并提交 src-tauri/icons/"
            exit 1
          fi

      - name: 初始化 Android 工程（幂等，仅首次需要）
        env:
          NONINTERACTIVE: "1"
        run: |
          if [ -d src-tauri/gen/android ]; then
            echo "src-tauri/gen/android 已存在，跳过 init"
          else
            # --ci 跳过交互提问（tauri android init --help 可确认该参数；
            # GitHub 自身会设置 CI=true，--ci 与 NONINTERACTIVE=1 双保险）。
            pnpm tauri android init --ci
          fi

      - name: 构建 debug APK
        run: pnpm tauri android build --debug --apk

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: linkup-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

# ---------------------------------------------------------------------------
# 可选：代码签名 / 公证（默认不启用；未配置 secrets 时三端产物均为未签名）
#
# macOS 签名 + 公证（在 macos job 的「构建」步骤上增加 env）：
#   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}              # base64 p12
#   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
#   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
#   APPLE_ID: ${{ secrets.APPLE_ID }}
#   APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
#   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
#
# Windows 代码签名：把证书放 secrets，在 src-tauri/tauri.conf.json 的
#   bundle.windows 配置 certificateThumbprint / signCommand，或在 CI 中注入 PFX。
#
# Android release 签名：本 workflow 默认只构建 debug APK（~/.android/debug.keystore）。
#   正式发布需注入 keystore secrets 并改走 pnpm tauri android build --aab；
#   keystore 与密码不要提交到仓库。
# ---------------------------------------------------------------------------
